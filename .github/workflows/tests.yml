name: Engine validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development checker
        run: python -m pip install . ruff==0.17.6
      - name: Static checks
        run: ruff check rpg tests tools
      - name: Format check
        run: ruff format --check rpg tests tools
      - name: Real engine tests, including localhost HTTP and process recovery
        run: python -W error::ResourceWarning -m unittest discover -v
      - name: Installed command
        run: rpg --help
      - name: Installed package outside the checkout
        run: python tools/check_install.py
