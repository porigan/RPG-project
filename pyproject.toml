[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-engine"
version = "0.1.0"
description = "A persistent, modular RPG engine with a constrained language-model boundary"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rpg = "rpg.cli:main"

[tool.setuptools.packages.find]
include = ["rpg*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

